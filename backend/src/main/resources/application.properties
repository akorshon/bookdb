spring.application.name=bookdb

spring.datasource.url=jdbc:mysql://localhost:3306/bangla_books?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=bookdb
spring.datasource.password=bookdb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8080

# --- Auth (dev defaults - change these for anything beyond local dev) ---
app.jwt.secret=change-this-dev-only-secret-key-it-needs-to-be-at-least-32-bytes-long
app.jwt.expiration-minutes=1440
app.admin.email=admin@bookdb.local
app.admin.password=ChangeMe123!

# --- Uploaded cover images ---
app.upload-dir=uploads

# --- Redis (cache + rate limiting) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Defense-in-depth safety net only; correctness relies on explicit @CacheEvict calls
# on every write path (see BookService/AuthorService/CategoryService/ReviewService).
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# --- API rate limiting (Redis-backed fixed window) ---
app.ratelimit.enabled=true
app.ratelimit.general-requests-per-minute=120
app.ratelimit.auth-requests-per-minute=10
